name: SciBytes — Directed Shorts (NASA footage)

# $0/month autonomous pipeline — Md-directed, GitHub executed:
# curated NASA public-domain visuals + eased Ken Burns motion +
# cyan karaoke captions + final-5s subscribe pill.
# 1 run/day. Telegram-only delivery via the DEDICATED SciBytes bot
# (SCIBYTES_TELEGRAM_BOT_TOKEN / SCIBYTES_TELEGRAM_CHAT_ID —
# never the History Uncut secrets). Md reviews & uploads manually.

on:
  schedule:
    # 14:45 UTC = 8:45 PM Dhaka — batch of 2 builds (~75 min),
    # videos in Md's hands ~10:00 PM Dhaka (prime time).
    # Suggested YouTube scheduling: video 1 -> tonight 1 AM Dhaka,
    # video 2 -> tomorrow 1 AM Dhaka (staggered).
    - cron: '45 14 * * *'
  workflow_dispatch:

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p ~/.fonts
          cp assets/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f ~/.fonts >/dev/null 2>&1 || true

      - name: Install Python deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q edge-tts pillow numpy

      - name: Install Node deps
        run: npm install --production=false

      - name: Build & deliver 2 Shorts (daily batch)
        env:
          SCIBYTES_TELEGRAM_BOT_TOKEN: ${{ secrets.SCIBYTES_TELEGRAM_BOT_TOKEN }}
          SCIBYTES_TELEGRAM_CHAT_ID: ${{ secrets.SCIBYTES_TELEGRAM_CHAT_ID }}
          SB_VOICE: en-US-ChristopherNeural
          SB_COUNT: 2
        run: |
          rm -f data/sb_v2_work/sb_batch_manifest.json
          for i in $(seq 1 ${SB_COUNT:-2}); do
            echo "================================ Batch video $i/${SB_COUNT:-2} ================================"
            SB_BATCH_LABEL="$i/${SB_COUNT:-2}" node scripts/sb-v2/direct.js || echo "⚠️ video $i failed — continuing batch"
          done
          node scripts/sb-v2/batch_summary.js || echo "⚠️ schedule summary failed (non-fatal)"

      - name: Upload QC frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sb-qc-frames-${{ github.run_id }}
          path: |
            data/sb_v2_work/qc_*.jpg
            data/sb_v2_work/thumb_*.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: Commit state
        if: always()
        run: |
          git config user.name "SciBytes Bot"
          git config user.email "bot@scibytes.internal"
          git add data/sb_v2_state.json data/videos/sb_v2_*.json || true
          git commit -m "Auto-update: sb-v2 directed state [skip ci]" || echo "No changes"
          git push || echo "Push failed (non-fatal)"
