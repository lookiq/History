name: Voice Samples
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Sample text'
        required: false
        default: 'He captured one hundred thirty-two German soldiers. Alone. This is the story of Alvin York, the most decorated American hero of World War One.'
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: |
          mkdir -p samples
          for v in en-US-ChristopherNeural en-US-EricNeural en-US-RogerNeural en-US-AndrewNeural; do
            name=$(echo "$v" | cut -d'-' -f3 | tr '[:upper:]' '[:lower:]')
            edge-tts --voice "$v" --text "${{ inputs.text }}" --write-media "samples/${name}.mp3"
          done
          ls -la samples/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-samples
          path: samples/*.mp3
