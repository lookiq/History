name: Voiceover
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Full voiceover script text'
        required: true
      voice:
        description: 'Edge TTS voice'
        required: false
        default: 'en-US-ChristopherNeural'
jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: |
          printf '%s' "${{ inputs.text }}" > script.txt
          python3 scripts/hu-v2/word_times.py script.txt "${{ inputs.voice }}" voiceover.mp3 words.json
          ls -la voiceover.mp3 words.json
          python3 -c "import json; w=json.load(open('words.json')); print('words:', len(w))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voiceover
          path: |
            voiceover.mp3
            words.json
